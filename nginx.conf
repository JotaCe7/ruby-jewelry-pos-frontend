server {
    listen 443 ssl;
    root /usr/share/nginx/html;
    index index.html;

    # Certs are Tailscale-issued (`tailscale cert <magicdns-name>` on the
    # VPS host), mounted read-only from /opt/ruby-pos/frontend/certs —
    # same cert files work for both staging and production, since it's
    # the same VPS/Tailscale device either way, just a different host
    # port. No plain :80 listener — this app is only ever reached over
    # Tailscale, so there's no "public" client to redirect from HTTP.
    ssl_certificate /etc/nginx/certs/ruby-pos.tail431802.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/ruby-pos.tail431802.ts.net.key;

    # "backend" resolves via the shared external Docker network — same
    # name whether this is the staging or production stack.
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: unknown paths fall back to index.html so client-side routing
    # (react-router) handles them instead of nginx 404ing on a refresh.
    location / {
        try_files $uri /index.html;
    }
}
